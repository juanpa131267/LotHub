# Nginx + PHP-FPM para LotHub (ver docs/DESPLIEGUE.md). Ajusta server_name, rutas y la versión de PHP.
# Certificado con Let's Encrypt:  certbot --nginx -d cartera.ejemplo.com

server {
    listen 80;
    server_name cartera.ejemplo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cartera.ejemplo.com;
    root /var/www/lothub/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/cartera.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartera.ejemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Planos DWG/DXF de hasta 50 MB (PLAN_MAX_MB) y extractos bancarios.
    client_max_body_size 60m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}
