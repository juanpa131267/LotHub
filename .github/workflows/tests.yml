name: Pruebas

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP 8.2 · MariaDB 11)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, pdo_mysql, mbstring, intl
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Base de pruebas (esquema oficial + parches + datos base)
        run: bash tests/setup-test-db.sh

      - name: Pruebas
        run: php vendor/bin/phpunit
